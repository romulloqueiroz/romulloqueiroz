<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Romullo Queiroz</title>
  <desc id="desc">I make complex products feel clear on first use, then ship the system underneath.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#DED8E7" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7255C4"/><stop offset="1" stop-color="#5E448F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#473858" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="720" height="440" rx="26" fill="#FAF8FC"/>
  <rect width="720" height="440" rx="26" fill="url(#grid)" opacity=".84"/>
  <path d="M0 350c140-48 240 68 380 7s224-53 340 5v78H0Z" fill="#EEE8F4"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="34" y="31" width="139" height="30" rx="15" fill="#EEE8F6" stroke="#D5CBE2"/>
    <circle cx="52" cy="46" r="5" fill="#7457C1"/>
    <text x="66" y="51" fill="#5D4E72" font-size="12" font-weight="700" letter-spacing="1.3">ROM / TOKYO</text>
    <text x="34" y="116" fill="#1F1B24" font-size="45" font-weight="760" letter-spacing="-1.7">I make complex products</text>
    <text x="34" y="166" fill="#1F1B24" font-size="45" font-weight="760" letter-spacing="-1.7">feel clear on first use.</text>
    <text x="34" y="216" fill="url(#accent)" font-size="45" font-weight="760" letter-spacing="-1.7">Then I ship the system.</text>
    <text x="36" y="397" fill="#514B57" font-size="16" font-weight="550">Founder · Product design + engineering · Tokyo</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="335" y="242" width="349" height="136" rx="24" fill="#FFFFFF" stroke="#D9D1E0"/>
    <rect x="356" y="258" width="110" height="23" rx="11.5" fill="#EEE8F6"/>
    <text x="371" y="274" fill="#684E9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" letter-spacing="1">LANGUAGE LIT</text>
    <text x="356" y="312" fill="#2C2329" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="22" font-weight="700">言葉は忘れたころに</text>
    <rect x="354" y="326" width="148" height="36" rx="8" fill="#D7A5B8"/>
    <text x="364" y="352" fill="#201A1E" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="750">戻ってくる。</text>
  </g>
  <circle cx="655" cy="70" r="31" fill="#7457C1"/><circle cx="693" cy="70" r="31" fill="#7457C1"/>
  <circle cx="655" cy="108" r="31" fill="#7457C1"/><circle cx="693" cy="108" r="31" fill="#7457C1"/>
  <rect x="557" y="383" width="116" height="34" rx="17" fill="#BDA7EF" transform="rotate(-7 557 383)"/>
</svg>
