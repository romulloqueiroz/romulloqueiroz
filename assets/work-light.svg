<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Selected work</title>
  <desc id="desc">Language Lit makes words return inside what you read next. Material 3 Expressive brings the full design system to React.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#E2DCE8" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#473858" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="338" rx="26" fill="#FAF8FC" stroke="#DED7E5"/>
  <rect width="1200" height="338" rx="26" fill="url(#grid)" opacity=".72"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="52" y="55" fill="#796C86" font-size="13" font-weight="750" letter-spacing="1.7">01 / PRODUCT</text>
    <text x="52" y="111" fill="#211D25" font-size="42" font-weight="760" letter-spacing="-1.4">Language Lit</text>
    <text x="52" y="153" fill="#674D9E" font-size="26" font-weight="700">Tap a word in one story. Meet it in the next.</text>
    <text x="52" y="197" fill="#514B56" font-size="18">One tap saves its meaning in that exact sentence.</text>
    <text x="52" y="223" fill="#514B56" font-size="18">Real FSRS brings it back on the day you'd forget it.</text>

    <rect x="52" y="261" width="128" height="34" rx="17" fill="#EEE9F2" stroke="#D8CFDF"/>
    <text x="71" y="283" fill="#4F4559" font-size="13" font-weight="700">33 LANGUAGES</text>
    <rect x="190" y="261" width="104" height="34" rx="17" fill="#EEE9F2" stroke="#D8CFDF"/>
    <text x="211" y="283" fill="#4F4559" font-size="13" font-weight="700">REAL FSRS</text>
    <rect x="304" y="261" width="172" height="34" rx="17" fill="#EEE9F2" stroke="#D8CFDF"/>
    <text x="323" y="283" fill="#4F4559" font-size="13" font-weight="700">CONTEXTUAL MEANING</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="762" y="43" width="386" height="251" rx="27" fill="#FFFFFF" stroke="#D8D0DF"/>
    <rect x="788" y="69" width="115" height="26" rx="13" fill="#EEE8F5"/>
    <text x="804" y="87" fill="#68519E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="750" letter-spacing="1.1">THE NEXT DAY</text>
    <text x="789" y="142" fill="#2B252C" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="25" font-weight="650">言葉は忘れたころに</text>
    <rect x="786" y="156" width="162" height="45" rx="8" fill="#D8A6B9"/>
    <text x="794" y="188" fill="#271C22" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="29" font-weight="750">戻ってくる。</text>
    <rect x="824" y="212" width="300" height="60" rx="18" fill="#F5F1F7" stroke="#DED6E2"/>
    <text x="845" y="237" fill="#807484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="1">戻る · MODORU</text>
    <text x="845" y="258" fill="#342D37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650">to return; to come back</text>
  </g>

  <rect y="382" width="1200" height="338" rx="26" fill="#F5F1F8" stroke="#DBD2E3"/>
  <rect y="382" width="1200" height="338" rx="26" fill="url(#grid)" opacity=".5"/>

  <g opacity=".98">
    <circle cx="98" cy="470" r="46" fill="#7054B4"/>
    <circle cx="158" cy="470" r="46" fill="#7054B4"/>
    <circle cx="98" cy="530" r="46" fill="#7054B4"/>
    <circle cx="158" cy="530" r="46" fill="#7054B4"/>
    <circle cx="267" cy="461" r="44" fill="#C47E93"/>
    <circle cx="267" cy="461" r="29" fill="#F5F1F8"/>
    <rect x="334" y="431" width="92" height="166" rx="46" fill="#CDBDFA"/>
    <path d="M489 468c28-29 78-2 55 35 39 1 44 53 5 63-17 36-70 27-74-13-38-11-34-64 7-67 0-7 2-13 7-18Z" fill="#A65370"/>
    <rect x="76" y="610" width="195" height="42" rx="21" fill="#8568D4" transform="rotate(-5 76 610)"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="640" y="437" fill="#756680" font-size="13" font-weight="750" letter-spacing="1.7">02 / OPEN SOURCE</text>
    <text x="640" y="493" fill="#211D25" font-size="42" font-weight="760" letter-spacing="-1.4">Material 3 Expressive</text>
    <text x="640" y="535" fill="#654A9B" font-size="26" font-weight="700">The full system, ready to ship in React.</text>
    <text x="640" y="578" fill="#514A57" font-size="18">41 conformant components with typed theme APIs,</text>
    <text x="640" y="604" fill="#514A57" font-size="18">precompiled CSS, and zero runtime dependencies.</text>

    <rect x="640" y="642" width="139" height="34" rx="17" fill="#E9E2EE" stroke="#D2C7DA"/>
    <text x="660" y="664" fill="#504557" font-size="13" font-weight="700">41 COMPONENTS</text>
    <rect x="789" y="642" width="174" height="34" rx="17" fill="#E9E2EE" stroke="#D2C7DA"/>
    <text x="809" y="664" fill="#504557" font-size="13" font-weight="700">ZERO RUNTIME DEPS</text>
    <rect x="973" y="642" width="144" height="34" rx="17" fill="#E9E2EE" stroke="#D2C7DA"/>
    <text x="995" y="664" fill="#504557" font-size="13" font-weight="700">REACT 18 + 19</text>
  </g>
</svg>
