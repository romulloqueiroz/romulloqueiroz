<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Romullo Queiroz</title>
  <desc id="desc">I make complex products feel clear on first use, then ship the system underneath. Founder of Language Lit and creative engineer in Tokyo.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#DFD9E8" stroke-width="1"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9FD"/>
      <stop offset="1" stop-color="#F3EFF8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7255C4"/>
      <stop offset="1" stop-color="#5E448F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3A2E50" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#wash)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)" opacity=".85"/>
  <path d="M0 362C180 290 322 424 502 348S842 256 1200 358V440H0Z" fill="#EEE8F4" opacity=".9"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="62" y="48" width="157" height="34" rx="17" fill="#EEE8F6" stroke="#D5CBE2"/>
    <circle cx="82" cy="65" r="6" fill="#7457C1"/>
    <text x="98" y="70" fill="#5D4E72" font-size="14" font-weight="700" letter-spacing="1.5">ROM / TOKYO</text>

    <text x="62" y="146" fill="#1F1B24" font-size="58" font-weight="760" letter-spacing="-2.3">I make complex products</text>
    <text x="62" y="211" fill="#1F1B24" font-size="58" font-weight="760" letter-spacing="-2.3">feel clear on first use.</text>
    <text x="62" y="276" fill="url(#accent)" font-size="58" font-weight="760" letter-spacing="-2.3">Then I ship the system.</text>
    <text x="64" y="342" fill="#514B57" font-size="19" font-weight="500">Founder of Language Lit  ·  Product design + engineering  ·  Open source</text>
    <text x="64" y="376" fill="#7B7383" font-size="15" font-weight="650" letter-spacing="1">ROMULLO QUEIROZ</text>
  </g>

  <g opacity=".95">
    <circle cx="1082" cy="53" r="36" fill="#7457C1"/>
    <circle cx="1132" cy="53" r="36" fill="#7457C1"/>
    <circle cx="1082" cy="103" r="36" fill="#7457C1"/>
    <circle cx="1132" cy="103" r="36" fill="#7457C1"/>
    <rect x="954" y="333" width="168" height="52" rx="26" fill="#C4ADF7" transform="rotate(-8 954 333)"/>
    <circle cx="1142" cy="326" r="36" fill="#D37D99"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="105" width="368" height="205" rx="30" fill="#FFFFFF" stroke="#D9D1E0"/>
    <rect x="784" y="128" width="126" height="27" rx="13.5" fill="#EEE8F6"/>
    <text x="800" y="147" fill="#684E9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">LANGUAGE LIT</text>
    <rect x="868" y="174" width="96" height="43" rx="7" fill="#F1DDE5"/>
    <rect x="782" y="221" width="176" height="44" rx="7" fill="#D7A5B8"/>
    <text x="792" y="205" fill="#2C2329" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="650">言葉は忘れたころに</text>
    <text x="792" y="254" fill="#201A1E" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="31" font-weight="700">戻ってくる。</text>
    <path d="M1074 177v21m0 0-8-8m8 8 8-8" fill="none" stroke="#7457C1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1040" y="222" fill="#8A7E91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="1">TAP</text>
    <text x="1019" y="240" fill="#51485A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650">MEET IT AGAIN</text>
  </g>
</svg>
