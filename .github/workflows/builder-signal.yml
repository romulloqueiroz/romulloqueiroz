name: Refresh builder signal

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Generate cards
        run: node scripts/generate-builder-signal.mjs
        env:
          PROFILE_USERNAME: romulloqueiroz
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit updated cards
        run: |
          if git diff --quiet -- assets/builder-signal-*.svg; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/builder-signal-*.svg
          git commit -m "chore: refresh builder signal"
          git push
